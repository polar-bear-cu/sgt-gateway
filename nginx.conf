worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 60;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    server {
        listen 80;
        server_name _;

        resolver 127.0.0.11 ipv6=off valid=30s;

        # Services
        location /api/v1/auth/ {
            set $auth_upstream auth-service;
            proxy_pass http://$auth_upstream:8080;
            include /etc/nginx/proxy_headers.conf;
        }
        location /api/v1/users/ {
            set $users_upstream user-service;
            proxy_pass http://$users_upstream:8080;
            include /etc/nginx/proxy_headers.conf;
        }
        location /api/v1/subscriptions {
            set $subscriptions_upstream subscription-service;
            proxy_pass http://$subscriptions_upstream:8080;
            include /etc/nginx/proxy_headers.conf;
        }
        location /api/v1/reports/ {
            set $reports_upstream report-service;
            proxy_pass http://$reports_upstream:8080;
            include /etc/nginx/proxy_headers.conf;
        }

        # Health Check
        location = /healthz {
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # UI
        location / {
            set $frontend_upstream frontend;
            proxy_pass http://$frontend_upstream:80;
            include /etc/nginx/proxy_headers.conf;
        }
    }
}
